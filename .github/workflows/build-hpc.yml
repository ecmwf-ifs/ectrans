name: build-hpc

# Controls when the action will run
on:

  # Trigger the workflow on all pushes, except on tag creation
  push:
    branches:
    - '**'
    tags-ignore:
    - '**'

  # Trigger the workflow on all pull requests
  pull_request: ~

  # Allow workflow to be dispatched on demand
  workflow_dispatch: ~

  # Trigger after public PR approved for CI
  pull_request_target:
    types: [labeled]

env:
  ECTRANS_TOOLS: ${{ github.workspace }}/.github/tools
  CTEST_PARALLEL_LEVEL: 1
  CACHE_SUFFIX: v1        # Increase to force new cache to be created

jobs:
  should-run:
    name: decide whether to run build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      value: ${{ steps.decision.outputs.value }}
    steps:
      - name: Checkout reusable workflow action
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/should-run

      - name: Decide whether this build should run
        id: decision
        uses: ./.github/actions/should-run

  ci-hpc:
    name: ci-hpc
    needs: should-run
    if: ${{ needs.should-run.outputs.value == 'true' && (!github.event.pull_request.head.repo.fork && github.event.action != 'labeled' || github.event.label.name == 'approved-for-ci') }}

    strategy:
      fail-fast: false    # false: try to complete all jobs

      matrix:
        name:
          - ac-ops intel
          - ac-gpu nvhpc
          - lumi-g cce

        include:
          - name: ac-ops intel
            site: ac-batch
            os: ecmwf-hpc2020
            compiler: intel-2023-2-0
            troika_user_secret: HPC_CI_SSH_USER
            arch: ecmwf/hpc2020/intel/2023.2.0/hpcx-openmpi/2.9.0
            sbatch_options: |
              #SBATCH --time=00:45:00
              #SBATCH --nodes=1
              #SBATCH --ntasks=4
              #SBATCH --cpus-per-task=32
              #SBATCH --gpus-per-task=0
              #SBATCH --mem=200G
              #SBATCH --qos=np
            env_vars:
              - CMAKE_GENERATOR=Ninja

          - name: ac-gpu nvhpc
            site: ac-batch
            os: ecmwf-hpc2020
            compiler: nvhpc-24-5
            troika_user_secret: HPC_CI_SSH_USER
            arch: ecmwf/hpc2020/nvhpc/24.5/hpcx-openmpi/2.19.0-cuda
            sbatch_options: |
              #SBATCH --time=01:30:00
              #SBATCH --nodes=1
              #SBATCH --ntasks=4
              #SBATCH --cpus-per-task=32
              #SBATCH --gpus-per-task=1
              #SBATCH --mem=200G
              #SBATCH --qos=ng
            env_vars:
              - CMAKE_GENERATOR=Ninja

          - name: lumi-g cce
            site: lumi
            os: lumi-g
            compiler: cce-19-0-0
            troika_user_secret: LUMI_CI_SSH_USER
            account_secret: LUMI_CI_PROJECT
            arch: eurohpc/lumi-g/cray/19.0.0
            sbatch_options: |
              #SBATCH --time=01:10:00
              #SBATCH --nodes=1
              #SBATCH --ntasks-per-node=8
              #SBATCH --gpus-per-task=1
              #SBATCH --partition=standard-g
              #SBATCH --account={0}
            env_vars:
              - ROCFFT_RTC_CACHE_PATH=$PWD/../../rocfft_kernel_cache.db
              - MPICH_GPU_SUPPORT_ENABLED=1
              - MPICH_SMP_SINGLE_COPY_MODE=NONE
              - CMAKE_GENERATOR=Ninja
            ctest_options: -E bitid # We don't bother with reproducibility checks on LUMI
            unsupported_dependency: ecmwf-ifs/field_api # We don't build Field API on LUMI for now


    runs-on: [self-hosted, linux, hpc]
    env:
      GH_TOKEN: ${{ github.token }}
      OUTPUT_DIR: ${{ format('/scratch/{0}/github-actions/ectrans/{1}/{2}/{3}', secrets[matrix.account_secret || matrix.troika_user_secret], github.run_id, strategy.job-index, github.run_attempt) }}
      WORKDIR: ${{ format('/scratch/{0}/github-actions/ectrans/{1}/{2}/{3}', secrets[matrix.account_secret || matrix.troika_user_secret], github.run_id, strategy.job-index, github.run_attempt) }}
    steps:

      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Reference artifact dir
        id: reference-artifact-dir
        shell: bash -eux {0}
        run: |
          reference_artifact_dir="${OUTPUT_DIR}/ectrans-reference-artifact"
          echo "path=${reference_artifact_dir}" >> "$GITHUB_OUTPUT"

      - name: Reference key
        id: reference-key
        shell: bash -eux {0}
        run: |
          reference_key=$(bash ${ECTRANS_TOOLS}/reference-key.sh "${{ matrix.os }}" "${{ matrix.compiler }}" default)
          echo "reference_key=${reference_key}" >> $GITHUB_OUTPUT

      - name: Build on HPC
        id: build_hpc
        uses: ecmwf-actions/reusable-workflows/ci-hpc-generic@v2
        with:
          site: ${{ matrix.site }}
          troika_user: ${{ secrets[matrix.troika_user_secret] }}
          sbatch_options: ${{ format(matrix.sbatch_options, secrets[matrix.account_secret]) }}
          output_dir: ${{ env.OUTPUT_DIR }}
          workdir: ${{ env.WORKDIR }}
          template_data: |
            site: ${{ matrix.site }}
            arch: ${{ matrix.arch }}
            cmake_options:
              - -DENABLE_ETRANS=ON
              - -DENABLE_FIELD_API=ON
              - -DENABLE_BITID_TESTS=ON
              - -DENABLE_REFERENCE_TESTS=ON
              - -DECTRANS_TEST_REFERENCE_DIR=$BASEDIR/$REPO/tests/references/${{ steps.reference-key.outputs.reference_key }}
            ctest_options: ${{ matrix.ctest_options || '' }}
            reference_key: ${{ steps.reference-key.outputs.reference_key }}
            reference_head_sha: ${{ github.event.pull_request.head.sha || github.sha }}
            reference_pr_number: "${{ github.event.pull_request.number || '' }}"
            reference_artifact_dir: ${{ steps.reference-artifact-dir.outputs.path }}
            reference_redact_secret: ${{ secrets[matrix.account_secret || matrix.troika_user_secret] }}
            dependencies:
              ecmwf/ecbuild:
                version: develop
              ecmwf-ifs/fiat:
                version: develop
                cmake_options:
                  - -DENABLE_MPI=ON
              ecmwf-ifs/field_api:
                version: v0.3.9
            unsupported_dependency: ${{ matrix.unsupported_dependency || '' }}
          template: |
            REPO=${{ github.event.pull_request.head.repo.full_name || github.repository }}
            SHA=${{ github.event.pull_request.head.sha || github.sha }}

            # Cleanup function
            cleanup() {
              {% for name in dependencies.keys() %}
                {% if name != unsupported_dependency %}
                  rm -r {{name}}
                {% endif %}
              {% endfor %}

              rm -r $REPO
              rm -r build

              {% for name in dependencies.keys() %}
                {% if name != unsupported_dependency %}
                  {% set org, proj = name.split('/') %}
                  rmdir {{org}} 2>/dev/null || true
                {% endif %}
              {% endfor %}
              repo_owner=$(dirname "$REPO")
              if [ "$repo_owner" != "." ]; then
                rmdir "$repo_owner" 2>/dev/null || true
              fi
            }
            error_trap() {
              cleanup

              echo "Finished: FAILURE"
              exit 1
            }

            trap error_trap ERR

            BASEDIR=$PWD

            set +x
            export ECTRANS_HPC_REFERENCE_PATH_SECRET="{{ reference_redact_secret }}"
            set -x

            {% for var in "${{ join(matrix.env_vars, ',') }}".split(',') %}
              export {{var}}
            {% endfor %}

            export CMAKE_TEST_LAUNCHER="srun;-n;1"
            export DR_HOOK_ASSERT_MPI_INITIALIZED=0

            # Fetch dependencies
            {% for name, options in dependencies.items() %}
              {% if name != unsupported_dependency %}
                mkdir -p {{name}}
                pushd {{name}}
                git init
                git remote add origin ${{ github.server_url }}/{{name}}
                git fetch origin {{options['version']}}
                git reset --hard FETCH_HEAD
                popd
              {% endif %}
            {% endfor %}

            # Fetch ecTrans
            mkdir -p $REPO
            pushd $REPO
            git init
            git remote add origin ${{ github.server_url }}/$REPO
            git fetch origin $SHA
            git reset --hard FETCH_HEAD
            popd

            source $BASEDIR/$REPO/package/bundle/arch/{{ arch }}/env.sh

            # Build dependencies
            {% for name, options in dependencies.items() %}
              {% if name != unsupported_dependency %}
                pushd {{name}}
                configure_start=$(date +%s)
                cmake -S . -B build \
                  {% for name in dependencies %}
                    {% if name != unsupported_dependency %}
                      {% set org, proj = name.split('/') %}
                      -D{{proj}}_ROOT=$BASEDIR/{{name}}/installation \
                    {% endif %}
                  {% endfor %}
                  {{ options['cmake_options']|join(' ') }}
                configure_end=$(date +%s)
                echo "{{name}} configure took $((configure_end - configure_start)) seconds"
                build_install_start=$(date +%s)
                cmake --build build
                cmake --install build --prefix installation
                build_install_end=$(date +%s)
                echo "{{name}} configure took $((configure_end - configure_start)) seconds"
                echo "{{name}} build and install took $((build_install_end - build_install_start)) seconds"
                popd
              {% endif %}
            {% endfor %}

            # Build ecTrans
            configure_start=$(date +%s)
            cmake -S $REPO -B build \
              {% for name in dependencies %}
                {% if name != unsupported_dependency %}
                  {% set org, proj = name.split('/') %}
                  -D{{proj}}_ROOT=$BASEDIR/{{name}}/installation \
                {% endif %}
              {% endfor %}
              {{ cmake_options|join(' ') }}
            configure_end=$(date +%s)
            echo "ecTrans configure took $((configure_end - configure_start)) seconds"
            build_start=$(date +%s)
            cmake --build build
            build_end=$(date +%s)
            echo "ecTrans configure took $((configure_end - configure_start)) seconds"
            echo "ecTrans build took $((build_end - build_start)) seconds"

            test_start=$(date +%s)
            set +e
            ctest --test-dir build --output-on-failure {{ ctest_options }}
            ctest_status=$?
            set -e
            test_end=$(date +%s)
            echo "ecTrans tests took $((test_end - test_start)) seconds"

            export ECTRANS_DEP_REF_ECBUILD=develop
            export ECTRANS_DEP_REF_FIAT=develop
            export ECTRANS_DEP_REF_FIELD_API=v0.3.9

            bash $REPO/.github/tools/reference-artifact-package.sh \
              "{{ reference_key }}" \
              "{{ reference_head_sha }}" \
              "{{ reference_pr_number }}" \
              "{{ reference_artifact_dir }}"

            cleanup

            if [ $ctest_status -ne 0 ]; then
              echo "Finished: FAILURE"
              exit $ctest_status
            fi

      - name: Ensure ci-infrastructure present
        if: ${{ always() && steps.build_hpc.outcome == 'success' }}
        uses: ecmwf/ci-infrastructure/actions/ensure-infrastructure-present@main

      - name: Fetch the reference artifacts from the HPC
        if: ${{ always() && steps.build_hpc.outcome == 'success' }}
        uses: ecmwf/ci-infrastructure/actions/fetch-hpc-tree@main
        with:
          site: ${{ matrix.site }}
          troika-user: ${{ secrets[matrix.troika_user_secret] }}
          remote-dir: ${{ steps.reference-artifact-dir.outputs.path }}
          local-dir: ${{ runner.temp }}/ectrans-reference-artifact

      - name: Remove the artifacts from the HPC
        if: ${{ always() && steps.build_hpc.outcome == 'success' }}
        uses: ecmwf/ci-infrastructure/actions/remove-hpc-tree@main
        with:
          site: ${{ matrix.site }}
          troika-user: ${{ secrets[matrix.troika_user_secret] }}
          remote-dir: ${{ steps.reference-artifact-dir.outputs.path }}

      - name: Upload reference artifact
        if: ${{ always() && steps.build_hpc.outcome == 'success' }}
        uses: actions/upload-artifact@v7
        with:
          name: ectrans-reference-artifact-${{ steps.reference-key.outputs.reference_key }}
          path: ${{ runner.temp }}/ectrans-reference-artifact
          retention-days: 14
          if-no-files-found: error

      - name: Cleanup reference artifact
        if: ${{ always() && steps.build_hpc.outcome == 'success' }}
        shell: bash -eux {0}
        run: |
          rm -rf "${{ runner.temp }}/ectrans-reference-artifact"
