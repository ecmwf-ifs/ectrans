name: build

# Controls when the action will run
on:

  # Trigger the workflow on all pushes, except on tag creation
  push:
    branches:
    - '**'
    tags-ignore:
    - '**'

  # Trigger the workflow on all pull requests
  pull_request: ~

  # Allow workflow to be dispatched on demand
  workflow_dispatch: ~

env:
  ECTRANS_TOOLS: ${{ github.workspace }}/.github/tools
  CTEST_PARALLEL_LEVEL: 1
  CACHE_SUFFIX: v3        # Increase to force new cache to be created

jobs:
  should-run:
    name: decide whether to run build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      value: ${{ steps.decision.outputs.value }}
    steps:
      - name: Checkout reusable workflow action
        uses: actions/checkout@v7
        with:
          persist-credentials: false
          sparse-checkout: .github/actions/should-run

      - name: Decide whether this build should run
        id: decision
        uses: ./.github/actions/should-run

  ci:
    name: ci
    needs: should-run
    if: needs.should-run.outputs.value == 'true'

    strategy:
      fail-fast: false    # false: try to complete all jobs

      matrix:
        build_type: [Release,Debug]
        name:
          - linux gnu-13
          - linux clang-18
          - linux nvhpc-26.3
          - linux intel-classic
          - linux intel-modern
          - macos

        include:

          - name: linux gnu-13
            os: ubuntu-24.04
            compiler: gnu-13
            compiler_cc: gcc-13
            compiler_cxx: g++-13
            compiler_fc: gfortran-13
            cmake_options: -DBLA_VENDOR=Generic
            ctest_options: -E memory
            caching: true

          - name: linux clang-18
            os: ubuntu-24.04
            compiler: clang-18
            compiler_cc: clang-18
            compiler_cxx: clang++-18
            compiler_fc: gfortran-14
            cmake_options: -DBLA_VENDOR=Generic
            ctest_options: -E memory
            caching: true

          - name: linux nvhpc-26.3
            os: ubuntu-24.04
            compiler: nvhpc-26.3
            compiler_cc: nvc
            compiler_cxx: nvc++
            compiler_fc: nvfortran
            cmake_options: -DBLA_VENDOR=Generic
            ctest_options: -E memory
            caching: true

          - name : linux intel-classic
            os: ubuntu-22.04
            compiler: intel-classic
            compiler_cc: icc
            compiler_cxx: icpc
            compiler_fc: ifort
            cmake_options: -DBLA_VENDOR=Generic
            caching: true

          - name : linux intel-modern
            os: ubuntu-24.04
            compiler: intel-modern
            compiler_cc: icx
            compiler_cxx: icpx
            compiler_fc: ifx
            cmake_options: -DCMAKE_Fortran_FLAGS=-heap-arrays -DBLA_VENDOR=Generic
            python-version: '3.11'
            caching: true

          - name: macos
            # Xcode compiler requires empty environment variables, so we pass null (~) here
            os: macos-15
            compiler: clang-17
            compiler_cc: ~
            compiler_cxx: ~
            compiler_fc: gfortran-13
            cmake_options: -DBLA_VENDOR=Generic
            caching: true

    runs-on: ${{ matrix.os }}
    steps:
    - name: System info
      shell: bash -eux {0}
      run: |
        if [[ "${{ matrix.os }}" =~ macos ]]; then
          system_profiler SPHardwareDataType -detailLevel mini
          sysctl machdep.cpu
        else
          sed '/^$/q' /proc/cpuinfo
        fi

    - name: Set up Python 3.11
      uses: actions/setup-python@v7
      with:
        python-version: 3.11

    - name: Checkout Repository
      uses: actions/checkout@v7

    # Free up disk space for nvhpc
    - name: Free Disk Space (Ubuntu)
      uses: jlumbroso/free-disk-space@main
      if: contains( matrix.compiler, 'nvhpc' )
      continue-on-error: true
      with:
        # this might remove tools that are actually needed,
        # if set to "true" but frees about 6 GB
        tool-cache: false

        # all of these default to true, but feel free to set to
        # "false" if necessary for your workflow
        android: true
        dotnet: true
        haskell: true
        large-packages: true
        docker-images: true
        swap-storage: true

    - name: Install NVHPC compiler
      if: contains( matrix.compiler, 'nvhpc' )
      shell: bash -eux {0}
      run: |
        ${ECTRANS_TOOLS}/install-nvhpc.sh --prefix /opt/nvhpc
        source /opt/nvhpc/env.sh
        echo "${NVHPC_DIR}/compilers/bin"                   >> $GITHUB_PATH
        [ -z ${MPI_HOME+x} ] || echo "MPI_HOME=${MPI_HOME}" >> $GITHUB_ENV
    - name: Download Intel compiler
      if: contains( matrix.compiler, 'intel' )
      run: |
        wget https://apt.repos.intel.com/intel-gpg-keys/GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
        sudo apt-key add GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
        rm GPG-PUB-KEY-INTEL-SW-PRODUCTS.PUB
        sudo add-apt-repository "deb https://apt.repos.intel.com/oneapi all main"

    - name: Install Intel classic compiler
      if: contains( matrix.compiler, 'intel-classic' )
      run: |
        version=2023.2.0
        sudo apt-get update
        sudo apt-get install \
          intel-oneapi-compiler-fortran-$version \
          intel-oneapi-compiler-dpcpp-cpp-and-cpp-classic-$version
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV
        echo "CACHE_SUFFIX=$CC-$($CC -dumpversion)" >> $GITHUB_ENV

    - name: Install Intel modern compiler
      if: contains( matrix.compiler, 'intel-modern' )
      run: |
        sudo apt-get update
        sudo apt-get install intel-oneapi-toolkit
        source /opt/intel/oneapi/setvars.sh
        printenv >> $GITHUB_ENV
        [ -z ${I_MPI_ROOT+x} ] || echo "MPI_HOME=${I_MPI_ROOT}" >> $GITHUB_ENV
        echo "CACHE_SUFFIX=$CC-$($CC -dumpversion)" >> $GITHUB_ENV

    - name: Environment
      run:  |
        echo "DEPS_DIR=${{ runner.temp }}/deps" >> $GITHUB_ENV
        echo "CC=${{ matrix.compiler_cc }}"     >> $GITHUB_ENV
        echo "CXX=${{ matrix.compiler_cxx }}"   >> $GITHUB_ENV
        echo "FC=${{ matrix.compiler_fc }}"     >> $GITHUB_ENV

        if [[ "${{ matrix.os }}" =~ macos ]]; then
          # GitHub-hosted macOS runners can include aws/tap, which Homebrew may reject as untrusted during auto-update.
          brew untap aws/tap || true
          brew install ninja
        else
          sudo apt-get update
          sudo apt-get install ninja-build
        fi

        printenv

    - name: Reference key
      id: reference-key
      shell: bash -eux {0}
      run: |
        reference_key=$(bash ${ECTRANS_TOOLS}/reference-key.sh "${{ matrix.os }}" "${{ matrix.compiler }}" "${{ matrix.build_type }}")
        reference_dir="${GITHUB_WORKSPACE}/tests/references/${reference_key}"
        echo "reference_key=${reference_key}" >> $GITHUB_OUTPUT
        echo "reference_dir=${reference_dir}" >> $GITHUB_OUTPUT

    - name: Dependency cache key
      id: dependency-cache-key
      shell: bash -eux {0}
      run: |
        echo "value=deps-${{ matrix.os }}-${{ matrix.compiler }}-${CACHE_SUFFIX}" >> $GITHUB_OUTPUT

    - name: Restore dependencies cache
      if: matrix.caching
      id: deps-cache
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/deps
        key: ${{ steps.dependency-cache-key.outputs.value }}


    - name: Set compile flags
      shell: bash -eux {0}
      run: |
        # Define flags to ensure a common baseline for the x86_64 runners, which have a mix of AMD and Intel processors.
        # This should make builds reproducible across runners to compare references.
        # This is also needed for self-compiled FFTW!
        #
        # Regardless of reproducibility across runners nvhpc needs the "-march=x86-64-v3" flag,
        # which is needed to avoid nvfortran errors of "Error during math dispatching processing..."
        # It seems the compiler detects an incompatible target processor on some of the runners,
        # in particular -tp=znver4 seems incompatible with "AMD EPYC 9V74 80-Core Processor" as shown by /proc/cpuinfo.

        TARGET_FLAGS="-march=x86-64-v3"
        if [[ "${{ matrix.os }}" =~ macos ]]; then
          # macos runners are all Apple Silicon, so we use the native architecture for reproducibility across runners.
          TARGET_FLAGS="-march=native"
        fi
        if [[ "${{ matrix.compiler }}" == "intel-classic" ]]; then
          # Classic intel compiler does not recognize -march=x86-64-v3, so we use -march=core-avx2 instead.
          TARGET_FLAGS="-march=core-avx2"
        fi

        MATH_FLAGS="-ffp-contract=off -fno-fast-math"
        if [[ "${{ matrix.compiler }}" =~ "nvhpc" ]]; then
          MATH_FLAGS="-Kieee -Mnofma"
        fi
        if [[ "${{ matrix.compiler }}" =~ "intel" ]]; then
          MATH_FLAGS="-fp-model consistent"
        fi

        echo "COMPILE_FLAGS=${TARGET_FLAGS} ${MATH_FLAGS}" >> $GITHUB_ENV

    - name: Install MPI
      shell: bash -eux {0}
      run: |
        FCFLAGS=-fPIC CFLAGS=-fPIC FFLAGS=-fPIC ${ECTRANS_TOOLS}/install-mpi.sh --mpi openmpi --prefix  ${DEPS_DIR}/openmpi
        [ -f ${DEPS_DIR}/openmpi/env.sh ] && source ${DEPS_DIR}/openmpi/env.sh
        [ -z ${MPI_HOME+x} ] || echo "MPI_HOME=${MPI_HOME}" >> $GITHUB_ENV
        if [[ "${{ matrix.os }}" =~ macos ]]; then
          mpi_cache_version=$(${ECTRANS_TOOLS}/openmpi-cache-version.py)
          echo "CACHE_SUFFIX=${CACHE_SUFFIX}-mpi_${mpi_cache_version}" >> $GITHUB_ENV
        fi

    - name: Install FFTW
      shell: bash -eux {0}
      run: |
        CFLAGS="-fPIC ${COMPILE_FLAGS}" ${ECTRANS_TOOLS}/install-fftw.sh --version 3.3.10 --with-single --prefix ${DEPS_DIR}/fftw
        echo "FFTW_ROOT=${DEPS_DIR}/fftw" >> $GITHUB_ENV

        if [[ "${{ matrix.os }}" != macos ]]; then
          echo "ECTRANS_FFTW_CFLAGS=-fPIC ${COMPILE_FLAGS}" >> $GITHUB_ENV
        fi
    - name: Install reference BLAS/LAPACK
      shell: bash -eux {0}
      run: |
        ${ECTRANS_TOOLS}/install-ref-blas-lapack.sh
        echo "ECTRANS_LAPACK_VENDOR=Netlib" >> $GITHUB_ENV

    - name: Save dependencies cache
      if: always() && matrix.caching && matrix.build_type == 'Debug' && steps.deps-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/deps
        key: ${{ steps.dependency-cache-key.outputs.value }}

    - name: Set Build & Test Environment
      run: |

        # Add mpirun to path for testing
        [ -z ${MPI_HOME+x} ] || echo "${MPI_HOME}/bin" >> $GITHUB_PATH

        # Force UCX (and thus OpenMPI's UCX PML) onto TCP + shared-memory transports.
        # The GitHub-hosted Azure runners intermittently expose a MANA (mana_0) RDMA/
        # InfiniBand device on which UCX fails to create UD queue-pairs, causing
        # MPI_Init to abort ("failed to create UD QP ... Operation not supported").
        # These are single-node tests that never need RDMA, so restrict transports to
        # loopback TCP + shared memory to make MPI startup deterministic.
        echo "UCX_TLS=tcp,self,sm" >> $GITHUB_ENV
        echo "UCX_NET_DEVICES=lo"  >> $GITHUB_ENV
        echo "UCX_LOG_LEVEL=error" >> $GITHUB_ENV

        if [[ "${{ matrix.os }}" =~ macos ]]; then
          echo "CMAKE_PREFIX_PATH=/opt/homebrew/opt/lapack${CMAKE_PREFIX_PATH:+:${CMAKE_PREFIX_PATH}}" >> $GITHUB_ENV
        fi

        echo "set( ECBUILD_Fortran_FLAGS \"${COMPILE_FLAGS}\" )" >> $PWD/toolchain.cmake
        echo "set( ECBUILD_C_FLAGS \"${COMPILE_FLAGS}\" )"       >> $PWD/toolchain.cmake
        echo "set( ECBUILD_CXX_FLAGS \"${COMPILE_FLAGS}\" )"     >> $PWD/toolchain.cmake
        cat $PWD/toolchain.cmake
        echo "CMAKE_TOOLCHAIN_FILE=$PWD/toolchain.cmake" >> $GITHUB_ENV

    - name: Build & Test
      id: build-test
      uses: ecmwf/build-package@v2
      with:
        self_coverage: false
        force_build: true
        cache_suffix: "${{ matrix.build_type }}-${{ env.CACHE_SUFFIX }}"
        recreate_cache: ${{ matrix.caching == false }}
        dependencies: |
          ecmwf/ecbuild
          ecmwf-ifs/fiat
          ecmwf-ifs/field_api@refs/tags/v0.3.9
        dependency_branch: develop
        dependency_cmake_options: |
          ecmwf-ifs/fiat:      "-G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_TESTS=OFF -DENABLE_MPI=ON"
          ecmwf-ifs/field_api: "-G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DENABLE_TESTS=OFF -DENABLE_CUDA=OFF"
        cmake_options:         "-G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} ${{ matrix.cmake_options }} -DENABLE_ETRANS=ON -DENABLE_MKL=OFF -DENABLE_FIELD_API=ON -DENABLE_FIAT_DEVELOP=ON -DENABLE_REFERENCE_TESTS=ON -DENABLE_BITID_TESTS=ON -DECTRANS_TEST_REFERENCE_DIR=${{ steps.reference-key.outputs.reference_dir }}"
        ctest_options: "${{ matrix.ctest_options }}"

    - name: Verify tools
      run: |
        export PATH=${{ steps.build-test.outputs.bin_path }}:$PATH

        echo "+ ectrans --info"
        ectrans --info

    - name: Package reference artifact
      if: always()
      shell: bash -eux {0}
      run: |
        # Set dependency references for provenance metadata in the reference artifact package.
        export ECTRANS_DEP_REF_ECBUILD=develop
        export ECTRANS_DEP_REF_FIAT=develop
        export ECTRANS_DEP_REF_FIELD_API=v0.3.9

        bash ${ECTRANS_TOOLS}/reference-artifact-package.sh \
          "${{ steps.reference-key.outputs.reference_key }}" \
          "${{ github.event.pull_request.head.sha || github.sha }}" \
          "${{ github.event.pull_request.number || '' }}" \
          "${RUNNER_TEMP}/ectrans-reference-artifact"

    - name: Upload reference artifact
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: ectrans-reference-artifact-${{ steps.reference-key.outputs.reference_key }}
        path: ${{ runner.temp }}/ectrans-reference-artifact
        retention-days: 14
        if-no-files-found: error


