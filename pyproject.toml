[project]
name = "ectrans4py"
dynamic = ["version"]
description = "ECTRANS interface for Python"
readme = "README.md"
requires-python = ">=3.10"
dependencies=[
    "numpy",
    "ctypesForFortran >=1.3.0, !=2.0.*, !=2.1.*",
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Intended Audience :: Science/Research',
    'Programming Language :: Python',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Operating System :: Unix',
]

[build-system]
requires = ["scikit-build-core>=0.10"]
# Thin wrapper around scikit-build-core that first runs `ectrans-bundle create`
# to clone the ecbuild/fiat dependencies (see _ectrans_build_backend.py).
build-backend = "_ectrans_build_backend"
backend-path = ["."]

[tool.scikit-build]
minimum-version = "build-system.requires"

# Require the same CMake as the top-level CMakeLists.txt
cmake.version = ">=3.25"

# Build the ecbundle-generated superbuild, which builds fiat (and ecbuild's
# macros) in-tree alongside ectrans so the wheel is self-contained.
cmake.source-dir = "package/bundle/source"

# The Python package lives under src/
wheel.packages = ["src/ectrans4py"]

# CMake installs into the ectrans4py package dir
wheel.install-dir = "ectrans4py"

# Read the version from the VERSION file
[tool.scikit-build.metadata.version]
provider = "scikit_build_core.metadata.regex"
input = "VERSION"
regex = '(?P<value>[^\s]+)'

# CMake configure options
[tool.scikit-build.cmake.define]
ENABLE_ETRANS = "ON"
ENABLE_ECTRANS4PY = "ON"
ENABLE_SINGLE_PRECISION = "OFF"
ENABLE_OMP = "ON"
FFTW_USE_STATIC_LIBS = "ON"
